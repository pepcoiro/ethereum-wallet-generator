<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet Ethereum Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <button id="generate" type="button">Generate Ethereum Wallet</button>
  <div id="results">
    <div class="field"><div class="label">Seed phrase</div><div class="value" id="mnemonic"></div><button class="copy-button" type="button" data-copy="mnemonic">Copy Seed Phrase</button></div>
    <div class="field"><div class="label">Ethereum Address</div><div class="value" id="address"></div><button class="copy-button" type="button" data-copy="address">Copy Address</button></div>
    <div class="field"><div class="label">Private Key</div><div class="value" id="private"></div><button class="copy-button" type="button" data-copy="private">Copy Private Key</button></div>
  </div>
  <footer class="disclaimer">
    <p>This tool is open source, so anyone can inspect the code and review how wallet keys are generated. For better security, download the code and run it offline on a trusted device.</p>
  <p class="copyright"><a href="https://pepcoiro.github.io/website/" target="_blank" rel="noopener noreferrer" data-current-year>@ 2026 Giuseppe Coiro</a></p>
  </footer>
</main>



<script src="script.js"></script>
</body>
</html>
